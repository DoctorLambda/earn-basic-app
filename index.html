<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Security & Info -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Secure Vault Interface for asset management." />
    <meta name="theme-color" content="#111827" /> <!-- Matches typical dark mode bg -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Typography: Inter (Clean, tabular-nums support for finance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <title>Vault Basic Interface</title>

    <!-- Critical Critical CSS to prevent Flash of White -->
    <style>
      body {
        margin: 0;
        background-color: #0f172a; /* Dark Slate 900 */
        font-family: 'Inter', sans-serif;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Simple loading spinner styles */
      .app-loader {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        border-top-color: #3b82f6; /* Blue 500 */
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial Loading State (Replaced by React upon hydration) -->
      <div class="app-loader">
        <div class="spinner"></div>
        <span style="font-size: 0.875rem; color: #94a3b8;">Initializing Vault...</span>
      </div>
    </div>
    
    <noscript>
      <div style="padding: 20px; color: white; text-align: center;">
        JavaScript is required to run the Vault Interface.
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
